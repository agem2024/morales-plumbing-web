name: Keep Render Bot Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  ping_render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bot URL
        run: |
          # REEMPLAZA ESTA URL CON LA URL REAL DE TU BOT EN RENDER
          # EJEMPLO: https://orion-telegram.onrender.com
          BOT_URL="https://orion-cloud-1.onrender.com"
          
          echo "Pinging $BOT_URL to keep it awake..."
          curl -sS "$BOT_URL" > /dev/null
          echo "Ping finished."

