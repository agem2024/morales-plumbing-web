    <!-- morales_theme_sync: Sync Theme & Language from Main Portal -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('morales_a11y_theme') || 'dark';
                if (theme === 'light') document.documentElement.dataset.theme = 'light';
                else delete document.documentElement.dataset.theme;
                var motion = localStorage.getItem('morales_a11y_motion');
                if (motion === 'reduced') document.documentElement.dataset.motion = 'reduced';
                var cb = localStorage.getItem('morales_a11y_colorblind');
                if (cb && cb !== 'none') document.documentElement.dataset.colorblind = cb;
                var fs = localStorage.getItem('morales_a11y_fontsize');
                if (fs && fs !== 'normal') document.documentElement.dataset.fontSize = fs;
                var lang = localStorage.getItem('morales_language') || localStorage.getItem('mp_language') || 'es';
                if (typeof setLanguage === 'function') setLanguage(lang);
                else if (typeof switchLang === 'function') switchLang(lang);
            } catch(e) {}
        })();
    </script>

    <div class="lang-filter">

    <div class="gallery-container" id="gallery">
        <!-- Content will be injected here via JS -->
    </div>

    <script>
        let allData = [];
        
        async function loadMedia() {
            try {
                // Fetch dynamic json data
                const response = await fetch('../assets/publicidad/data.json');
                if(!response.ok) throw new Error("No data.json");
                allData = await response.json();
                
                // Set default language from global settings or default to ES
                const currentLang = localStorage.getItem('selectedLanguage') || 'es';
                
                // Activate the correct button
                document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                const targetBtn = Array.from(document.querySelectorAll('.lang-btn')).find(b => b.textContent.toLowerCase().includes(currentLang === 'en' ? 'english' : 'espa�ol'));
                if(targetBtn) targetBtn.classList.add('active');
                
                renderMedia(currentLang);
            } catch(e) {
                document.getElementById('gallery').innerHTML = "<div class='empty-state'>An no hay im�genes publicadas o ocurri� un error al cargar los datos.</div>";
                console.error(e);
            }
        }
        
        function filterLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMedia(lang);
        }
        
        function renderMedia(lang) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            const filtered = allData.filter(item => item.lang === lang || lang === 'all');
            
            if(filtered.length === 0) {
                gallery.innerHTML = "<div class='empty-state'>No hay contenido disponible para este idioma.</div>";
                return;
            }
            
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'media-item';
                div.innerHTML = `<img src="${item.path}" alt="${item.filename}" loading="lazy">`;
                gallery.appendChild(div);
            });
        }
        
        // Listen to global app.js changes just in case
        window.addEventListener('languageChanged', (e) => {
            if(e.detail) {
                const targetBtn = Array.from(document.querySelectorAll('.lang-btn')).find(b => b.textContent.toLowerCase().includes(e.detail === 'en' ? 'english' : 'espa�ol'));
                if(targetBtn) {
                    targetBtn.click();
                } else {
                    renderMedia(e.detail);
                }
            }
        });

        loadMedia();
    </script>
